name: restaurant-saas

services:
  # Round 10 (B-NEW-43): postgres/redis/mongo NÃO publicam portas no host.
  # `expose:` declara a porta na network interna do compose; serviços
  # peer (api, ai-service, web-customer) acessam via nome de container.
  # Antes `ports: 5434:5434` etc vazava as 3 DBs pra internet em VPS sem
  # firewall — CPFs + tokens + chat history expostos. Para acesso dev:
  #   docker exec -it restaurant-postgres psql -U postgres -p 5434
  #   docker exec -it restaurant-redis redis-cli
  #   docker exec -it restaurant-mongodb mongosh
  postgres:
    image: postgres:16
    container_name: restaurant-postgres
    expose:
      - "5434"
    command: -p 5434 -c log_min_duration_statement=100
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: restaurant_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5434"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: restaurant-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: restaurant-mongodb
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
      # Init script (TTL + lookup indexes pro chat history). Mongo executa
      # entrypoint-initdb.d/* SO no primeiro boot (volume vazio). Pra re-run
      # idempotente em volume existente, use `npm run mongo:init`.
      - ./packages/database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:20-alpine
    container_name: restaurant-api
    working_dir: /repo/apps/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
      NODE_ENV: development
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5434
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: restaurant_saas
      DATABASE_URL: postgresql://postgres:postgres@postgres:5434/restaurant_saas
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: restaurant_chat
      MONGODB_SECURITY_DB: restaurant_security
      QR_HMAC_SECRET: change-me-in-prod
      # Segredo compartilhado do header x-staff-key. SEM default committado:
      # o literal `dev-staff-api-key-change-in-prod` estava no git e virava
      # segredo publico se o operador subisse o compose sem exportar a var.
      # Sem STAFF_API_KEY setado o boot da API falha fast (main.ts).
      STAFF_API_KEY: ${STAFF_API_KEY:?STAFF_API_KEY must be set (no committed default)}
      CORS_ORIGINS: http://localhost:3003,http://localhost:3002,http://${PUBLIC_HOST:-localhost}:3003,http://${PUBLIC_HOST:-localhost}:3002
      CUSTOMER_APP_URL: http://${PUBLIC_HOST:-localhost}:3003
      AI_SERVICE_URL: http://ai-service:8000
      # Keep API waits slightly above ai-service's local LLM timeout so
      # LMStudio responses can finish during simulator/dev runs.
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-95000}
      # Round 7 (B-NEW-25): apps/api passa este header em chamadas pro
      # ai-service. Mesmo valor que o ai-service env carrega.
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-dev-ai-service-key-change-in-prod}
    volumes:
      - ./:/repo
      - /repo/node_modules
      - /repo/apps/api/node_modules
    ports:
      - "3001:3001"
    # Round 4 §C-NEW-1: roda `migrate:tenants` ANTES do start:dev pra que
    # migrations adicionadas em tenant-template sejam aplicadas a todos os
    # schemas existentes automaticamente. Falha de migration é FATAL de
    # verdade (decisão Caleb 2026-06-10): sem migrations o schema fica
    # inconsistente e a API não pode subir. O caso "primeiro boot sem
    # tenants" já sai 0 no próprio script ('nenhum tenant encontrado ·
    # skip') — o `|| echo` antigo só servia pra engolir erro real.
    command: >-
      sh -c "cd /repo &&
      npm install --no-audit --no-fund &&
      (cd packages/database && npx ts-node scripts/migrate-tenants.ts) &&
      cd /repo/apps/api &&
      (npm run start:dev || npm run dev)"

  ai-service:
    image: python:3.11-slim
    container_name: restaurant-ai
    working_dir: /app
    # Default aponta pro LM Studio rodando no host do Mac. Pra trocar por
    # OpenAI/Anthropic/Google, sobrescreva no .env do repo (LLM_PROVIDER, etc).
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      # host.docker.internal resolve pro Mac de dentro do container (Docker Desktop).
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_API_KEY: ${LLM_API_KEY:-lm-studio}
      LLM_MODEL_MAIN: ${LLM_MODEL_MAIN:-qwen2.5-7b-instruct-mlx}
      LLM_MODEL_CLASSIFIER: ${LLM_MODEL_CLASSIFIER:-qwen2.5-7b-instruct-mlx}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-90}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # P0 #B-1 / Cat 1 (round 3): tools que chamam ctx.api_client batiam
      # em http://localhost:3000 (default do config.py) e davam Connection
      # refused — localhost:3000 dentro do container não resolve pro NestJS
      # rodando em outra container. Aponta pro service docker `api` na
      # porta interna 3001 (host port também é 3001).
      API_BASE_URL: ${API_BASE_URL:-http://api:3001/api}
      API_REQUEST_TIMEOUT: ${API_REQUEST_TIMEOUT:-10}
      # Mesmo segredo x-staff-key da API. Sem default committado.
      STAFF_API_KEY: ${STAFF_API_KEY:?STAFF_API_KEY must be set (no committed default)}
      # Round 7 (B-NEW-25): API key compartilhada entre apps/api → ai-service.
      # Sem isso, ai-service estava sem auth alguma — combinado com porta
      # exposta era DoS gratuito. Agora middleware FastAPI exige header
      # `X-AI-Service-Key`. Apps/api passa o mesmo valor em cada chamada.
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-dev-ai-service-key-change-in-prod}
    volumes:
      - ./services/ai-service:/app
    # Round 7 (B-NEW-25): porta NÃO publicada no host. ai-service só é
    # acessível via Docker network nome `http://ai-service:8000` pelo
    # apps/api e outros services internos. Antes `ports: 8000:8000`
    # expunha pra internet em VPS sem firewall — atacante hits direto
    # /chat e queima OPENAI_API_KEY/Anthropic budget.
    expose:
      - "8000"
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  web-customer:
    image: node:20-alpine
    container_name: restaurant-web-customer
    working_dir: /repo/apps/web-customer
    depends_on:
      - api
    environment:
      NODE_ENV: development
      # Same-origin proxy: o client fetcha `/api/*` em 3003 e o Next
      # reescreve pra `http://api:3001/api/*` via next.config.js. Evita
      # ter que liberar 3001 no firewall do Mac em cenarios como
      # iPhone + hotspot. PUBLIC_HOST nao e mais usado no client.
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_WS_URL: http://${PUBLIC_HOST:-localhost}:3001
      # iOS Safari blocks geolocation prompts on plain HTTP LAN origins.
      # Keep local table/QR testing usable without a trusted HTTPS cert.
      NEXT_PUBLIC_ALLOW_INSECURE_LAN_GEOLOCATION: ${NEXT_PUBLIC_ALLOW_INSECURE_LAN_GEOLOCATION:-true}
    volumes:
      - ./:/repo
      - /repo/node_modules
      - /repo/apps/web-customer/node_modules
      - /repo/apps/web-customer/.next
    ports:
      - "3003:3003"
    command: sh -c "cd /repo && npm install --no-audit --no-fund && cd apps/web-customer && npm run dev"

  web-staff:
    image: node:20-alpine
    container_name: restaurant-web-staff
    working_dir: /repo/apps/web-staff
    depends_on:
      - api
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:3001/api
      NEXT_PUBLIC_WS_URL: http://${PUBLIC_HOST:-localhost}:3001
      NEXT_PUBLIC_TENANT_SLUG: restaurant_dev
      # P1-F: NEXT_PUBLIC_STAFF_API_KEY REMOVIDO. Toda var NEXT_PUBLIC_* e
      # inlinada no bundle JS servido ao browser — expor o x-staff-key ali
      # entregava credencial de nivel staff/kitchen a qualquer visitante via
      # DevTools. O segredo agora e SO server-side (STAFF_API_KEY abaixo),
      # injetado pelo proxy /api/proxy. NAO reintroduzir com prefixo NEXT_PUBLIC_.
      # Proxy server-side das TVs (/api/proxy): roda DENTRO do container,
      # então a API é o service docker `api`, não localhost. Sem isso o
      # default localhost:3001 dava 502 "fetch failed" e a TV ficava em
      # "Erro inesperado" no stack dockerizado (achado do E2E tv-delivery).
      STAFF_API_BASE_URL: http://api:3001/api
      # O proxy injeta x-staff-key server-side (P1-F: key fora do bundle).
      # Sem default committado — mesmo segredo que a API valida.
      STAFF_API_KEY: ${STAFF_API_KEY:?STAFF_API_KEY must be set (no committed default)}
    volumes:
      - ./:/repo
      - /repo/node_modules
      - /repo/apps/web-staff/node_modules
      - /repo/apps/web-staff/.next
    ports:
      - "3002:3002"
    command: sh -c "cd /repo && npm install --no-audit --no-fund && cd apps/web-staff && npm run dev"

volumes:
  postgres_data:
    name: restaurant-saas_postgres_data
    external: true
  mongodb_data:
    name: restaurant-saas_mongodb_data
    external: true
  redis_data:
    name: restaurant-saas_redis_data
    external: true
