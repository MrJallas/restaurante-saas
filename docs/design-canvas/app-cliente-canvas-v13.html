
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>App do Cliente · V13 — Navegação 100% conversacional · 24 LLM tools + chips reativos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body, #root { margin: 0; height: 100%; background: #f0eee9; font-family: Inter, system-ui, sans-serif; }
  .dc-card *::-webkit-scrollbar { display: none; }
  .dc-card * { scrollbar-width: none; }
  @keyframes gNotifPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.012)} }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="handoff/cliente/cliente-tokens.jsx"></script>
<script type="text/babel" src="handoff/cliente/cliente-screens-v13.jsx"></script>

<script type="text/babel">
  const HeaderV13 = () => (
    <div style={{
      padding: '40px 60px 32px', maxWidth: 980,
      fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <div style={{
        fontFamily: "'JetBrains Mono', ui-monospace, monospace",
        fontSize: 11, fontWeight: 500, letterSpacing: 1.5,
        textTransform: 'uppercase', color: '#6b6b6b', marginBottom: 14,
      }}>App do Cliente · V13 · navegação 100% conversacional</div>

      <div style={{
        fontSize: 36, fontWeight: 600, letterSpacing: -0.6,
        color: '#0a0a0a', lineHeight: 1.1, marginBottom: 12,
      }}>Chips contextuais reativos · 24 LLM tools · ContextualInputExpand inline</div>

      <div style={{
        fontSize: 15, lineHeight: 1.55, color: '#4d4d4d', maxWidth: 760,
        letterSpacing: -0.05,
      }}>
        Toda resposta da IA termina com <b>2-4 chips contextuais</b> sugerindo as
        próximas ações prováveis. São o canal principal de navegação · não
        opcionais. Cliente sempre completa o fluxo de 2 formas equivalentes:
        tap chip (1 toque) ou texto livre (LLM detecta intent e roteia pra
        mesma tool). Ambos disparam a mesma tool · mesmos params · mesmo
        resultado. Quando chip exige texto livre (<code style={{
          fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5,
          padding: '1px 6px', background: '#e8e6e0', borderRadius: 4 }}>requiresText: true</code>),
        a UI <b>expande inline com animação suave</b> — não abre tela nova.
        Apresentamos 3 variantes de animação Apple-flavor (snappy / liquid / drape)
        pra você escolher. ToolCallIndicator entre bubbles sinaliza tool calls
        sem interromper leitura. Tools de staff exigem texto não-vazio (
        <code style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5,
          padding: '1px 6px', background: '#e8e6e0', borderRadius: 4 }}>STAFF_TOOLS_REQUIRING_TEXT</code>)
        · gerente nunca recebe reclamação sem motivo.
      </div>

      <div style={{
        marginTop: 24, display: 'flex', flexWrap: 'wrap', gap: 12,
        fontFamily: "'JetBrains Mono', ui-monospace, monospace",
        fontSize: 10.5, letterSpacing: 1, textTransform: 'uppercase', color: '#6b6b6b',
      }}>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>9 seções</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>22 frames</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>24 tools · 6 grupos</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>3 variantes de animação</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>handoff em /handoff/cliente/cliente-screens-v13.jsx</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>spec LGPD · /docs/features/chat-history-lgpd.md</span>
      </div>

      <div style={{
        marginTop: 28, padding: '14px 18px', background: '#fff',
        border: '1px solid #e5e5e5', borderRadius: 12, maxWidth: 760,
      }}>
        <div style={{
          fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 500,
          letterSpacing: 1.4, textTransform: 'uppercase', color: '#0a0a0a',
          marginBottom: 10,
        }}>Decisão pendente · animação do ContextualInputExpand</div>
        <div style={{ fontSize: 13.5, color: '#0a0a0a', lineHeight: 1.5, letterSpacing: -0.05 }}>
          Seção <b>v13.1</b> tem 3 variantes Apple-flavor pra você escolher: <b>A · spring snappy</b>{' '}
          (iOS sheet · 520ms) · <b>B · liquid morph</b> (Apple Music · 580ms) · <b>C · soft drape</b>{' '}
          (Apple Mail compose · 640ms). Pick a favorita no próximo round · descarto as outras 2.
          Por default, todos os outros frames de v13 já usam a variante A (snappy) — o canvas inteiro
          continua coerente até a sua escolha.
        </div>
      </div>
    </div>
  );

  const Root = () => (
    <DesignCanvas>
      <DCSection id="header" title="" subtitle="">
        <div key="hdr"><HeaderV13 /></div>
      </DCSection>

      {window.CLIENTE_LLM_SECTIONS.map(sec => (
        <DCSection key={sec.id} id={sec.id} title={`${sec.id} · ${sec.title}`} subtitle={sec.subtitle}>
          {sec.frames}
        </DCSection>
      ))}
    </DesignCanvas>
  );

  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
