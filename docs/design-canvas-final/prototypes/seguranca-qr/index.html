<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Protótipo · Segurança QR (isolado)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body, #root { margin: 0; height: 100%; background: #f0eee9; font-family: Inter, system-ui, sans-serif; }
  @keyframes gPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Bundle do garçom: tokens, frames, design canvas, primitives MTopBar/MBottomNav/MStat/MPill -->
<script type="text/babel" src="../../handoff/garcom/ios-frame.jsx"></script>
<script type="text/babel" src="../../handoff/garcom/android-frame.jsx"></script>
<script type="text/babel" src="../../handoff/garcom/design-canvas.jsx"></script>
<script type="text/babel" src="../../handoff/garcom/garcom-tokens.jsx"></script>
<script type="text/babel" src="../../handoff/garcom/garcom-screens-a.jsx"></script>
<script type="text/babel" src="../../handoff/garcom/garcom-screens-c.jsx"></script>
<script type="text/babel" src="../../handoff/garcom/garcom-screens-d.jsx"></script>

<!-- Componentes Security ressuscitados aqui -->
<script type="text/babel" src="security-screens.jsx"></script>

<script type="text/babel">
  const AB_W = 414;
  const AB_H = 920;
  const FrameSlot = ({ os, dark, children }) => {
    const F = os === 'android' ? AndroidFrame : IOSFrame;
    return <F dark={dark}>{children}</F>;
  };

  const Header = () => (
    <div style={{ padding: '40px 60px 32px', maxWidth: 980 }}>
      <div style={{
        fontFamily: "ui-monospace, 'JetBrains Mono', monospace",
        fontSize: 11, fontWeight: 500, letterSpacing: 1.5,
        textTransform: 'uppercase', color: '#6b6b6b', marginBottom: 14,
      }}>Protótipo isolado · não plugado em app · revisão futura</div>
      <div style={{ fontSize: 36, fontWeight: 600, letterSpacing: -0.6, color: '#0a0a0a', lineHeight: 1.1, marginBottom: 12 }}>
        Segurança · QR codes (watcher)
      </div>
      <div style={{ fontSize: 15, lineHeight: 1.55, color: '#4d4d4d', maxWidth: 720, letterSpacing: -0.05 }}>
        2 telas: visão geral (pending + IPs bloqueados + eventos 24 h) e auditoria de 90 dias.
        Decisão de produto sobre onde mora ainda não veio — fica aqui isolado.
      </div>
    </div>
  );

  const Root = () => (
    <DesignCanvas>
      <DCSection id="header" title="" subtitle=""><div key="hdr"><Header /></div></DCSection>

      <DCSection id="security" title="Segurança · QR codes" subtitle="Watcher de tráfego anômalo no painel de quem decide.">
        <DCArtboard id="sec-overview-ios" label="Visão geral · iOS" width={AB_W} height={AB_H}>
          <FrameSlot os="ios"><ScreenManagerSecurity /></FrameSlot>
        </DCArtboard>
        <DCArtboard id="sec-overview-and" label="Visão geral · Android" width={AB_W} height={AB_H}>
          <FrameSlot os="android"><ScreenManagerSecurity /></FrameSlot>
        </DCArtboard>
        <DCArtboard id="sec-filter-high" label="Filtro 'Críticos' · iOS" width={AB_W} height={AB_H}>
          <FrameSlot os="ios"><ScreenManagerSecurity sevFilter="high" /></FrameSlot>
        </DCArtboard>
        <DCArtboard id="sec-investigate-ios" label="Investigar mesa 22 · iOS" width={AB_W} height={AB_H}>
          <FrameSlot os="ios"><ScreenManagerSecurity state="investigate" tableId={22} /></FrameSlot>
        </DCArtboard>
        <DCArtboard id="sec-investigate-and" label="Investigar mesa 22 · Android" width={AB_W} height={AB_H}>
          <FrameSlot os="android"><ScreenManagerSecurity state="investigate" tableId={22} /></FrameSlot>
        </DCArtboard>
      </DCSection>

      <DCSection id="audit" title="Auditoria · 90 dias" subtitle="Cursor-pagination · GET /admin/security/audit.">
        <DCArtboard id="aud-all-ios" label="Todas · iOS" width={AB_W} height={AB_H}>
          <FrameSlot os="ios"><ScreenManagerSecurityAudit /></FrameSlot>
        </DCArtboard>
        <DCArtboard id="aud-rejected" label="Rejeitadas · iOS" width={AB_W} height={AB_H}>
          <FrameSlot os="ios"><ScreenManagerSecurityAudit filter="rejected" /></FrameSlot>
        </DCArtboard>
        <DCArtboard id="aud-blocked" label="Bloqueadas · iOS" width={AB_W} height={AB_H}>
          <FrameSlot os="ios"><ScreenManagerSecurityAudit filter="blocked" /></FrameSlot>
        </DCArtboard>
        <DCArtboard id="aud-table" label="Filtro mesa 22 · iOS" width={AB_W} height={AB_H}>
          <FrameSlot os="ios"><ScreenManagerSecurityAudit tableFilter={22} /></FrameSlot>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );

  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
