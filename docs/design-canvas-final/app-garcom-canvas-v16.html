
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>App do Gerente · V16 — Late-arrival · notificação passiva (round 8b · staff-side)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  html, body, #root {
    margin: 0; height: 100%;
    background: #f0eee9;
    font-family: Inter, system-ui, sans-serif;
  }
  @keyframes gPulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  @keyframes gAlertPulse { 0%,100%{box-shadow:0 0 0 0 rgba(217,142,43,.55)} 50%{box-shadow:0 0 0 6px rgba(217,142,43,0)} }
  @keyframes gNotifPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.012)} }
  @keyframes gBlink { 50%{opacity:0} }
  @keyframes gFadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="handoff/garcom/ios-frame.jsx"></script>
<script type="text/babel" src="handoff/garcom/android-frame.jsx"></script>
<script type="text/babel" src="handoff/garcom/design-canvas.jsx"></script>
<script type="text/babel" src="handoff/garcom/garcom-tokens.jsx"></script>
<script type="text/babel" src="handoff/garcom/garcom-qr-issue.jsx"></script>
<script type="text/babel" src="handoff/garcom/garcom-late-arrival-info.jsx"></script>

<script type="text/babel">
  const HeaderG = () => (
    <div style={{
      padding: '40px 60px 32px', maxWidth: 980,
      fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <div style={{
        fontFamily: "'JetBrains Mono', ui-monospace, monospace",
        fontSize: 11, fontWeight: 500, letterSpacing: 1.5,
        textTransform: 'uppercase', color: '#6b6b6b', marginBottom: 14,
      }}>App do Gerente · V16 · round 8b · staff-side late-arrival</div>

      <div style={{
        fontSize: 36, fontWeight: 600, letterSpacing: -0.6,
        color: '#0a0a0a', lineHeight: 1.1, marginBottom: 12,
      }}>Late-arrival aprovado pelo host · staff só vê info passiva</div>

      <div style={{
        fontSize: 15, lineHeight: 1.55, color: '#4d4d4d', maxWidth: 760,
        letterSpacing: -0.05,
      }}>
        Round 8b é majoritariamente <b>customer-side</b> · ver{' '}
        <code style={{
          fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5,
          padding: '1px 6px', background: '#e8e6e0', borderRadius: 4,
        }}>app-cliente-canvas-v15.html</code> · seção{' '}
        <i>customer-late-arrival-flow</i> (8 frames). Do lado staff, o único
        impacto é uma <b>notificação passiva</b> depois que o customer-host
        aprovou. Sem cascata · sem aprovação staff · sem alerta. Só info.
        Decisão social entre clientes resolve entre clientes; se host não
        responde em 60 s, cliente B chama recepcionista presencialmente
        (waiter-call existente · humano resolve com humano). V16 estende V15:
        as 2 seções anteriores (customer-host pattern + qr-issue staff-flow)
        permanecem · adiciona{' '}
        <code style={{
          fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5,
          padding: '1px 6px', background: '#e8e6e0', borderRadius: 4,
        }}>staff-late-arrival-info</code>{' '}
        com 2 frames (iOS · Android).
      </div>

      <div style={{
        marginTop: 24, display: 'flex', flexWrap: 'wrap', gap: 12,
        fontFamily: "'JetBrains Mono', ui-monospace, monospace",
        fontSize: 10.5, letterSpacing: 1, textTransform: 'uppercase', color: '#6b6b6b',
      }}>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>3 seções (V15 + 1 nova)</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>12 frames (10 herdados + 2 novos)</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>iOS + Android</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>handoff em /handoff/garcom/garcom-late-arrival-info.jsx</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>spec · /docs/features/customer-host-model.md</span>
      </div>

      <div style={{
        marginTop: 28, padding: '16px 18px', background: '#fff',
        border: '1px solid #e5e5e5', borderRadius: 12, maxWidth: 760,
      }}>
        <div style={{
          fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 500,
          letterSpacing: 1.4, textTransform: 'uppercase', color: '#0a0a0a',
          marginBottom: 12,
        }}>Decisões deste round (escopo reduzido)</div>
        {[
          ['1 · Sem cascata staff', 'Late-arrival agora é fluxo simples · single approver (customer-host) · TTL 60 s · sem fallback automático pra recepcionista/manager/garçom. escalation_chains continua existindo · só pra QR ilegível.'],
          ['2 · Escape valve humano', 'Se host não responde em 60 s OU recusa, cliente B vê "Chamar recepcionista" e cai no waiter-call existente. Software não escala · humano resolve com humano.'],
          ['3 · Staff é só info', 'MInProgressCard kind="info-late-arrival" · border-left ink (não mostarda · não vermelho) · auto-some em 60 s · sem CTA primário · só awareness operacional.'],
          ['4 · Edge case NULL host', 'Walk-ins (sessão aberta direto pelo staff · host_customer_id = NULL) · backend recusa automaticamente · cliente B vê "Mesa não tá aceitando entrada via app · chamar a recepcionista?".'],
        ].map(([num, body]) => (
          <div key={num} style={{
            display: 'grid', gridTemplateColumns: '180px 1fr', gap: 14,
            padding: '10px 0', borderBottom: '1px solid #f0eee9',
            fontSize: 13, color: '#0a0a0a', lineHeight: 1.5, letterSpacing: -0.05,
          }}>
            <div style={{
              fontFamily: "'JetBrains Mono', monospace", fontSize: 11, fontWeight: 600,
              letterSpacing: 0.5, color: '#0a0a0a',
            }}>{num}</div>
            <div>{body}</div>
          </div>
        ))}
      </div>
    </div>
  );

  const Root = () => (
    <DesignCanvas>
      <DCSection id="header" title="" subtitle="">
        <div key="hdr"><HeaderG /></div>
      </DCSection>

      {/* Princípio · herdado de V15 (2 frames customer-host) */}
      {window.GARCOM_HOST_PATTERN_SECTIONS.map(sec => (
        <DCSection key={sec.id} id={sec.id} title={`${sec.id} · ${sec.title}`} subtitle={sec.subtitle}>
          {sec.frames}
        </DCSection>
      ))}

      {/* Staff QR-issue · herdado de V15 (8 frames) */}
      {window.GARCOM_QR_ISSUE_SECTIONS.map(sec => (
        <DCSection key={sec.id} id={sec.id} title={`${sec.id} · ${sec.title}`} subtitle={sec.subtitle}>
          {sec.frames}
        </DCSection>
      ))}

      {/* ★ NOVO V16 · Late-arrival info (2 frames iOS + Android) */}
      {window.GARCOM_LATE_ARRIVAL_INFO_SECTIONS.map(sec => (
        <DCSection key={sec.id} id={sec.id} title={`${sec.id} · ${sec.title}`} subtitle={sec.subtitle}>
          {sec.frames}
        </DCSection>
      ))}
    </DesignCanvas>
  );

  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
