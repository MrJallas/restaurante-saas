<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TV — Cozinha & Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html,body,#root{margin:0;height:100%;background:#0b0b14;font-family:Inter,system-ui,sans-serif;}
  /* Cada tela ocupa 1920×1080. Empilhadas verticalmente para visualização. */
  .tv-stack { display: flex; flex-direction: column; gap: 32px; padding: 32px;
    align-items: center; min-height: 100%; box-sizing: border-box; }
  .tv-frame { width: 1920px; height: 1080px; box-shadow: 0 16px 60px rgba(0,0,0,0.4);
    border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .tv-label { color: rgba(255,255,255,0.6); font-size: 14px; letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tv-screens.jsx"></script>
</body>
</html>
