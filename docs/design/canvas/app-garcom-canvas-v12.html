<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>App do Gerente · V12 — Reclamação como chamado novo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  html, body, #root {
    margin: 0; height: 100%;
    background: #f0eee9;
    font-family: Inter, system-ui, sans-serif;
  }
  @keyframes gPulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  @keyframes gAlertPulse { 0%,100%{box-shadow:0 0 0 0 rgba(196,58,58,.55)} 50%{box-shadow:0 0 0 6px rgba(196,58,58,0)} }
  @keyframes gNotifPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.012)} }
  @keyframes gBlink { 50%{opacity:0} }
  @keyframes gFadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="handoff/garcom/ios-frame.jsx"></script>
<script type="text/babel" src="handoff/garcom/android-frame.jsx"></script>
<script type="text/babel" src="handoff/garcom/design-canvas.jsx"></script>
<script type="text/babel" src="handoff/garcom/garcom-tokens.jsx"></script>
<script type="text/babel" src="handoff/garcom/garcom-complaint.jsx"></script>

<script type="text/babel">
  const HeaderG = () => (
    <div style={{
      padding: '40px 60px 32px', maxWidth: 980,
      fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <div style={{
        fontFamily: "'JetBrains Mono', ui-monospace, monospace",
        fontSize: 11, fontWeight: 500, letterSpacing: 1.5,
        textTransform: 'uppercase', color: '#6b6b6b', marginBottom: 14,
      }}>App do Gerente · V12 · reclamação como tipo de chamado</div>

      <div style={{
        fontSize: 36, fontWeight: 600, letterSpacing: -0.6,
        color: '#0a0a0a', lineHeight: 1.1, marginBottom: 12,
      }}>Reclamação · Mesa 14 · Caleb · 3 estrelas</div>

      <div style={{
        fontSize: 15, lineHeight: 1.55, color: '#4d4d4d', maxWidth: 720,
        letterSpacing: -0.05,
      }}>
        Estende <code style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5,
          padding: '1px 6px', background: '#e8e6e0', borderRadius: 4 }}>Call.type</code>{' '}
        com <code style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5,
          padding: '1px 6px', background: '#e8e6e0', borderRadius: 4 }}>'complaint'</code>.
        Aparece em 3 lugares: <b>Painel</b> (MInProgressCard pattern V4),{' '}
        <b>Operação · Alertas</b> (card crítico no topo) e <b>Push lockscreen</b>{' '}
        (som crítico · não silencia em zone-pause). Tap abre{' '}
        <code style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5,
          padding: '1px 6px', background: '#e8e6e0', borderRadius: 4 }}>ScreenCallDetail</code>{' '}
        type="complaint" com hero brick · 4 chips de resposta rápida · composer custom.
        Após enviar, card vira state=resolved-summary com read receipt em tempo real.
      </div>

      <div style={{
        marginTop: 24, display: 'flex', flexWrap: 'wrap', gap: 12,
        fontFamily: "'JetBrains Mono', ui-monospace, monospace",
        fontSize: 10.5, letterSpacing: 1, textTransform: 'uppercase', color: '#6b6b6b',
      }}>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>7 seções</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>7 frames</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>iOS + Android</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>handoff em /handoff/garcom/garcom-complaint.jsx</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>app do cliente · app-cliente-canvas-v2.html</span>
      </div>
    </div>
  );

  const Root = () => (
    <DesignCanvas>
      <DCSection id="header" title="" subtitle="">
        <div key="hdr"><HeaderG /></div>
      </DCSection>

      {window.GARCOM_COMPLAINT_SECTIONS.map(sec => (
        <DCSection key={sec.id} id={sec.id} title={`${sec.id} · ${sec.title}`} subtitle={sec.subtitle}>
          {sec.frames}
        </DCSection>
      ))}
    </DesignCanvas>
  );

  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
