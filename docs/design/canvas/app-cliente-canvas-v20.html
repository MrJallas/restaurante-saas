<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>App do Cliente · V20 — consolidação visual · alinhar canvas ao código de produção</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body, #root { margin: 0; height: 100%; background: #f0eee9; font-family: Inter, system-ui, sans-serif; }
  .dc-card *::-webkit-scrollbar { display: none; }
  .dc-card * { scrollbar-width: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>

<!-- ORDEM IMPORTA · primitivos antes · sections que dependem deles depois -->
<script type="text/babel" src="handoff/cliente/cliente-tokens.jsx"></script>
<script type="text/babel" src="handoff/cliente/cliente-late-arrival.jsx"></script>
<script type="text/babel" src="handoff/cliente/cliente-table-merge.jsx"></script>
<script type="text/babel" src="handoff/cliente/cliente-screens-v14.jsx"></script>
<script type="text/babel" src="handoff/cliente/cliente-menu-drawer-v20.jsx"></script>
<script type="text/babel" src="handoff/cliente/cliente-journey-v20.jsx"></script>

<script type="text/babel">
  const monoStyle = {
    fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5,
    padding: '1px 6px', background: '#e8e6e0', borderRadius: 4,
  };

  const Tag = ({ children, tone = 'neutral' }) => {
    const tones = {
      neutral: { bg: '#fff',     border: '#e5e5e5', color: '#0a0a0a' },
      new:     { bg: '#fbf1d8',  border: '#b88a1a', color: '#7a5b0d' },
      ink:     { bg: '#0a0a0a',  border: '#0a0a0a', color: '#fff' },
      done:    { bg: '#e3efe7',  border: '#2f7d4f', color: '#1a4d2e' },
      pending: { bg: '#fbe9e7',  border: '#c43a3a', color: '#7a1f1f' },
    };
    const t = tones[tone];
    return (
      <span style={{
        padding: '6px 10px', background: t.bg, border: `1px solid ${t.border}`,
        color: t.color, borderRadius: 4,
      }}>{children}</span>
    );
  };

  const HeaderV20 = () => (
    <div style={{
      padding: '40px 60px 32px', maxWidth: 1080,
      fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <div style={{
        fontFamily: "'JetBrains Mono', ui-monospace, monospace",
        fontSize: 11, fontWeight: 500, letterSpacing: 1.5,
        textTransform: 'uppercase', color: '#6b6b6b', marginBottom: 14,
      }}>App do Cliente · V20 · consolidação visual · alinhar canvas ao código de produção</div>

      <div style={{
        fontSize: 36, fontWeight: 600, letterSpacing: -0.6,
        color: '#0a0a0a', lineHeight: 1.1, marginBottom: 12,
      }}>7 primitivos cirurgicamente alinhados · MenuDrawer reaberto · journey inteiro consolidado em 13 frames</div>

      <div style={{
        fontSize: 15, lineHeight: 1.55, color: '#4d4d4d', maxWidth: 820,
        letterSpacing: -0.05,
      }}>
        Round cirúrgico depois de 19 rounds de design. Source of truth para PRIMITIVOS visuais virou o código de
        produção em <code style={monoStyle}>apps/web-customer/src</code> (linguagem evoluiu independentemente do canvas).
        Canvas alinha à produção, não o contrário, pros primitivos. Pras FEATURES novas (V13-V19), canvas é a
        especificação que o Claude Code vai implementar. Este round entrega: <b>(1)</b> 7 patches em
        <code style={monoStyle}>cliente-tokens.jsx</code> alinhando SoftInput, Bubble, TopBar, PillButton, kicker
        Inter e MonoLabel Inter à produção; <b>(2)</b> <code style={monoStyle}>cliente-menu-drawer-v20.jsx</code> ·
        novo · cobre 3 evoluções de prod (CTA "Voltar ao assistente" condicional, "Sair da mesa" como ação
        destrutiva destacada, anotação behavior conversacional do "Ajuda") + sugestão de host indicator;
        <b>(3)</b> <code style={monoStyle}>cliente-journey-v20.jsx</code> · novo · DCSection consolidado com 13
        frames em sequência narrativa do escanear-QR ao LGPD · entregável visual principal · hand-off pro
        Claude Code.
      </div>

      <div style={{
        marginTop: 24, display: 'flex', flexWrap: 'wrap', gap: 12,
        fontFamily: "'JetBrains Mono', ui-monospace, monospace",
        fontSize: 10.5, letterSpacing: 1, textTransform: 'uppercase', color: '#6b6b6b',
      }}>
        <Tag tone="done">7 primitivos alinhados</Tag>
        <Tag tone="new">★ MenuDrawer V20 (novo)</Tag>
        <Tag tone="new">★ Customer journey · 13 frames</Tag>
        <Tag tone="ink">3 sections · 13 + 3 + 30 frames</Tag>
        <Tag>handoff/cliente/cliente-tokens.jsx (patched)</Tag>
        <Tag>handoff/cliente/cliente-menu-drawer-v20.jsx (new)</Tag>
        <Tag>handoff/cliente/cliente-journey-v20.jsx (new)</Tag>
        <Tag tone="pending">hand-off Claude Code · ver topo de cliente-tokens.jsx</Tag>
      </div>

      <div style={{
        marginTop: 28, padding: '16px 18px', background: '#fff',
        border: '1px solid #e5e5e5', borderRadius: 12, maxWidth: 820,
      }}>
        <div style={{
          fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 500,
          letterSpacing: 1.4, textTransform: 'uppercase', color: '#0a0a0a',
          marginBottom: 12,
        }}>7 patches deste round · diff vs V19</div>
        {[
          ['A.1 · LiquidInput → SoftInput', 'Backdrop-filter abandonado em prod (jank em Safari iOS). Canvas vira pill sólido bg-surface · sem filter · borda transparente focus-within ink/20 · shadow 1px 4% · seta send 42×42 ink·white sempre visível · placeholder mute (não faint).'],
          ['A.2 · CustomerBubble · corner-cut + padding', 'Radius 18 + bottom-right 4px (tail visual) · padding 12/16 (era 10/14). Timestamp mono externo MANTIDO · vai como melhoria pro Claude Code (HAND-OFF B.5).'],
          ['A.3 · TopBar · borders + sticky + safe-area', 'Hamburger border ink (não borderSoft) · hairline 0.5px borderSoft no fundo · sticky top-0 z-30 com paddingTop calc(max(safe-area, 12px) + 8px) pra Dynamic Island do iPhone 16.'],
          ['A.4 · PillButton · remove ghost variant', 'Prod tem só outline/filled. Canvas tinha 3. Nenhum callsite usava ghost · só doc no README.'],
          ['A.5 · AssistantBlock kicker · Inter (não MonoLabel)', 'Kicker do hero virou Inter uppercase tracking-1px. Mantém posicionamento inline-sem-bubble · ortogonal à bubble do chat.'],
          ['A.6 · MonoLabel · Inter weight 600 tracking 1.5', 'Decisão fechada · Inter aproximação canônica. Visualmente "mono caps tiny tracked" · não literalmente monospace. Refactor de naming pro Claude Code (sugestão: Eyebrow).'],
          ['A.7 · MenuDrawer V20 · arquivo novo', 'CTA "Voltar ao assistente" condicional · "Sair da mesa" como button danger destacado · Ajuda com behavior conversacional (anotação) · host indicator sugerido.'],
          ['A.8 · Customer journey · DCSection consolidado', '13 frames em sequência narrativa · entregável principal · cada frame com tool/intent + screen/rota + diff vs prod + tag (aligned · só prod · só canvas · diverge · pendente).'],
        ].map(([num, body]) => (
          <div key={num} style={{
            display: 'grid', gridTemplateColumns: '260px 1fr', gap: 14,
            padding: '10px 0', borderBottom: '1px solid #f0eee9',
            fontSize: 13, color: '#0a0a0a', lineHeight: 1.5, letterSpacing: -0.05,
          }}>
            <div style={{
              fontFamily: "'JetBrains Mono', monospace", fontSize: 11, fontWeight: 600,
              letterSpacing: 0.5, color: '#0a0a0a',
            }}>{num}</div>
            <div>{body}</div>
          </div>
        ))}
      </div>

      <div style={{
        marginTop: 20, padding: '14px 18px', maxWidth: 820,
        background: '#fbe9e7', border: '1px solid #c43a3a',
        borderRadius: 12,
        fontSize: 13, color: '#7a1f1f', lineHeight: 1.55, letterSpacing: -0.05,
      }}>
        <span style={{
          fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 600,
          letterSpacing: 1.4, textTransform: 'uppercase', display: 'block', marginBottom: 6,
        }}>Hand-off Claude Code · 5 grupos · ver topo de cliente-tokens.jsx</span>
        <b>B.1</b> tokens novos (warning + 3 washes em globals.css + tailwind.config.ts) · <b>B.2</b> 14 componentes novos
        do canvas pra implementar em prod · <b>B.3</b> 6 features inteiras pendentes (manager, merge, cortesia, LGPD UI,
        "Eu" histórico, ContextualChips/Expand) · <b>B.4</b> 4 decisões UX pendentes (frames 05-08 do journey) ·
        <b> B.5</b> timestamp mono externo nos user bubbles.
      </div>
    </div>
  );

  const Root = () => (
    <DesignCanvas>
      <DCSection id="header" title="" subtitle="">
        <div key="hdr"><HeaderV20 /></div>
      </DCSection>

      {/* ENTREGÁVEL PRINCIPAL · journey consolidado · 13 frames */}
      {(window.CLIENTE_JOURNEY_V20_SECTIONS || []).map(sec => (
        <DCSection key={sec.id} id={sec.id} title={`${sec.id} · ${sec.title}`} subtitle={sec.subtitle}>
          {sec.frames}
        </DCSection>
      ))}

      {/* MenuDrawer V20 · cobertura nova · 3 frames */}
      {(window.CLIENTE_MENU_DRAWER_V20_SECTIONS || []).map(sec => (
        <DCSection key={sec.id} id={sec.id} title={`${sec.id} · ${sec.title}`} subtitle={sec.subtitle}>
          {sec.frames}
        </DCSection>
      ))}

      {/* Sections existentes · re-renderizadas com primitivos V20 alinhados */}
      {(window.CLIENTE_LATE_ARRIVAL_SECTIONS || []).map(sec => (
        <DCSection key={sec.id} id={sec.id} title={`${sec.id} · ${sec.title}`} subtitle={sec.subtitle}>
          {sec.frames}
        </DCSection>
      ))}
      {(window.CLIENTE_TABLE_MERGE_SECTIONS || []).map(sec => (
        <DCSection key={sec.id} id={sec.id} title={`${sec.id} · ${sec.title}`} subtitle={sec.subtitle}>
          {sec.frames}
        </DCSection>
      ))}
      {(window.CLIENTE_LLM_SECTIONS_V14 || []).map(sec => (
        <DCSection key={sec.id} id={sec.id} title={`${sec.id} · ${sec.title}`} subtitle={sec.subtitle}>
          {sec.frames}
        </DCSection>
      ))}
    </DesignCanvas>
  );

  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
