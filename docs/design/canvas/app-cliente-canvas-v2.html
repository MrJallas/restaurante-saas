
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>App do Cliente · V12 — Avaliação e reclamação pós-entrega</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body, #root { margin: 0; height: 100%; background: #f0eee9; font-family: Inter, system-ui, sans-serif; }
  .dc-card *::-webkit-scrollbar { display: none; }
  .dc-card * { scrollbar-width: none; }
  @keyframes gNotifPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.012)} }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="handoff/cliente/cliente-tokens.jsx"></script>
<script type="text/babel" src="handoff/cliente/cliente-screens-v2.jsx"></script>

<script type="text/babel">
  const HeaderV2 = () => (
    <div style={{
      padding: '40px 60px 32px', maxWidth: 980,
      fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <div style={{
        fontFamily: "'JetBrains Mono', ui-monospace, monospace",
        fontSize: 11, fontWeight: 500, letterSpacing: 1.5,
        textTransform: 'uppercase', color: '#6b6b6b', marginBottom: 14,
      }}>App do Cliente · V12 · avaliação e reclamação pós-entrega</div>

      <div style={{
        fontSize: 36, fontWeight: 600, letterSpacing: -0.6,
        color: '#0a0a0a', lineHeight: 1.1, marginBottom: 12,
      }}>Como foi o pedido? · reclamação como chamado novo no gerente</div>

      <div style={{
        fontSize: 15, lineHeight: 1.55, color: '#4d4d4d', maxWidth: 720,
        letterSpacing: -0.05,
      }}>
        Trigger pós-entrega: 3-5 min depois do garçom marcar o pedido como{' '}
        <code style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5,
          padding: '1px 6px', background: '#e8e6e0', borderRadius: 4 }}>delivered</code>,
        cliente recebe push perguntando como foi o pedido. Rating ≥ 4 + textarea vazia
        finaliza · qualquer outra combinação leva pro fluxo de reclamação. A reclamação
        chega pro gerente como <b>chamado novo tipo `complaint`</b> com pattern visual
        próprio (V4 MInProgressCard) · resposta da gerente vira <code style={{
          fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5, padding: '1px 6px',
          background: '#e8e6e0', borderRadius: 4 }}>ManagerBubble</code> no chat IA do
        cliente, agora estendido com <b>chip-action inset</b> ("Renata avisou: chega em 3 min").
      </div>

      <div style={{
        marginTop: 24, display: 'flex', flexWrap: 'wrap', gap: 12,
        fontFamily: "'JetBrains Mono', ui-monospace, monospace",
        fontSize: 10.5, letterSpacing: 1, textTransform: 'uppercase', color: '#6b6b6b',
      }}>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>6 seções</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>10 frames</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>iOS + Android</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>handoff em /handoff/cliente/cliente-screens-v2.jsx</span>
        <span style={{ padding: '6px 10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: 4 }}>app do gerente · app-garcom-canvas-v12.html</span>
      </div>
    </div>
  );

  const Root = () => (
    <DesignCanvas>
      <DCSection id="header" title="" subtitle="">
        <div key="hdr"><HeaderV2 /></div>
      </DCSection>

      {window.CLIENTE_COMPLAINT_SECTIONS.map(sec => (
        <DCSection key={sec.id} id={sec.id} title={`${sec.id} · ${sec.title}`} subtitle={sec.subtitle}>
          {sec.frames}
        </DCSection>
      ))}
    </DesignCanvas>
  );

  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
