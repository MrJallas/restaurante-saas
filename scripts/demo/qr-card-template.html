<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  body { margin:0; background:#FAF7F2; padding:80px; font-family:"Instrument Sans",sans-serif; }
  .card { width:1280px; margin:0 auto; background:#FFFFFF; border:3px solid #26221C; border-radius:36px; padding:112px 96px 88px; text-align:center; }
  .eyebrow { display:block; font-family:"IBM Plex Mono",monospace; font-size:30px; letter-spacing:6px; color:#7A2E33; font-weight:500; }
  h1 { font-family:"Young Serif",Georgia,serif; font-weight:400; font-size:88px; margin:40px 0 0; color:#26221C; line-height:1.15; }
  .qrbox { display:inline-block; background:#FFFFFF; border:2px solid #E5DDD2; border-radius:28px; padding:52px; margin-top:48px; font-size:0; }
  .qrbox svg { width:720px; height:720px; }
  .sub { font-size:38px; color:#6B6156; line-height:1.5; max-width:24em; margin:44px auto 0; }
  .rule { width:112px; border:none; border-top:4px solid #7A2E33; margin:44px auto; }
  .passos { display:block; font-family:"IBM Plex Mono",monospace; font-size:26px; letter-spacing:3px; color:#988D80; text-transform:uppercase; }
</style>
<div class="card">
  <span class="eyebrow">MESA 01</span>
  <h1>Aponte a câmera<br>e peça daqui mesmo</h1>
  <div class="qrbox">{{QR_SVG}}</div>
  <p class="sub">Cardápio, pedido, garçom e conta — tudo pelo seu celular, sem baixar nada.</p>
  <hr class="rule">
  <span class="passos">ESCANEIE · ESCOLHA · APROVEITE</span>
</div>
